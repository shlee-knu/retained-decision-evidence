[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-event-validation-research"
version = "0.3.0"
description = "Public-data logistics event conformance benchmark and reproducible research draft"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["requests", "pandas", "numpy", "scipy", "matplotlib", "jsonschema[format]", "rdflib", "pyshacl", "pm4py", "declare4py==2.2.0", "python-docx", "lxml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
